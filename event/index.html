"../../htmreport/macd_s_V6C.html"],["Overview","../overview_scan_pdax.html#V6C"]],"VBK":[["MACD Report","../../htmreport/macd_events_s_vbk.html"],["MACD Chart","../../htmreport/macd_s_VBK.html"],["Overview","../overview_scan_sdax.html#VBK"]],"VH2":[["MACD Report","../../htmreport/macd_events_s_vh2.html"],["MACD Chart","../../htmreport/macd_s_VH2.html"],["Overview","../overview_scan_sdax.html#VH2"]],"VNA":[["MACD Report","../../htmreport/macd_events_s_vna.html"],["MACD Chart","../../htmreport/macd_s_VNA.html"],["Overview","../overview_scan_dax.html#VNA"]],"VOS":[["MACD Report","../../htmreport/macd_events_s_vos.html"],["MACD Chart","../../htmreport/macd_s_VOS.html"],["Overview","../overview_scan_sdax.html#VOS"]],"VOW3":[["MACD Report","../../htmreport/macd_events_s_vow3.html"],["MACD Chart","../../htmreport/macd_s_VOW3.html"],["Overview","../overview_scan_dax.html#VOW3"]],"WAC":[["MACD Report","../../htmreport/macd_events_s_wac.html"],["MACD Chart","../../htmreport/macd_s_WAC.html"],["Overview","../overview_scan_sdax.html#WAC"]],"WAF":[["MACD Report","../../htmreport/macd_events_s_waf.html"],["MACD Chart","../../htmreport/macd_s_WAF.html"],["Overview","../overview_scan_mdax.html#WAF"]],"WCH":[["MACD Report","../../htmreport/macd_events_s_wch.html"],["MACD Chart","../../htmreport/macd_s_WCH.html"],["Overview","../overview_scan_mdax.html#WCH"]],"YSN":[["MACD Report","../../htmreport/macd_events_s_ysn.html"],["MACD Chart","../../htmreport/macd_s_YSN.html"],["Overview","../overview_scan_sdax.html#YSN"]],"ZAL":[["MACD Report","../../htmreport/macd_events_s_zal.html"],["MACD Chart","../../htmreport/macd_s_ZAL.html"],["Overview","../overview_scan_dax.html#ZAL"]]};
</script>

<script>
(function () {
  var DATA = window.EVENT_DATA || {};
  var LINKS = window.EVENT_LINKS || {};
  var EV = DATA.events || {};
  var MARKS = DATA.marks || {};

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function addD(d, n) {
    var x = new Date(d.getTime());
    x.setDate(x.getDate() + n);
    return x;
  }
  function monday(d) {
    var x = new Date(d.getTime());
    return addD(x, -((x.getDay() + 6) % 7));
  }
  function label(d, we) {
    var mn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
              'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return (we ? '' : mn[d.getMonth()] + ' ') + d.getDate();
  }
  function longLabel(d) {
    var mn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
              'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return d.getDate() + ' ' + mn[d.getMonth()] + ' ' + d.getFullYear();
  }

  var TODAY = fmt(new Date());
  var periodStart = monday(new Date());
  var CODES = [];
  var BY_DATE = {};
  Object.keys(EV).forEach(function (code) {
    CODES.push(code);
    var seen = {};
    (EV[code] || []).forEach(function (e) {
      if (!e || !e.date) return;
      var k = e.date + '\u0000' + (e.desc || '');
      if (seen[k]) return;
      seen[k] = 1;
      (BY_DATE[e.date] = BY_DATE[e.date] || [])
        .push({ c: code, d: e.desc || '', s: e.src || 'hist' });
    });
  });
  CODES.sort();

  // upcoming (pm) first, then alpha -- the tl_calendar sort rule
  function evSort(a, b) {
    var ap = a.s === 'pm' ? 0 : 1, bp = b.s === 'pm' ? 0 : 1;
    if (ap !== bp) return ap - bp;
    return a.c < b.c ? -1 : (a.c > b.c ? 1 : 0);
  }

  // ---- calendar ----------------------------------------------------------
  function renderCalendar() {
    document.getElementById('cPeriod').textContent =
      longLabel(periodStart) + ' \u2013 ' + longLabel(addD(periodStart, 13));
    var h = '';
    var names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    for (var i = 0; i < 7; i++) h += '<div class="cal-hd">' + names[i] + '</div>';
    for (var j = 0; j < 14; j++) {
      var d = addD(periodStart, j), ds = fmt(d), we = (j % 7) >= 5;
      var list = (BY_DATE[ds] || []).slice().sort(evSort);
      var n = list.length, cap = we ? 8 : 36;
      var cls = 'cal-cell' + (we ? ' we' : '') + (ds === TODAY ? ' today' : '')
        + (n <= 4 ? '' : (n <= 9 ? ' dense' : ' densest'));
      h += '<div class="' + cls + '"><div class="cal-h">' + label(d, we) + '</div>';
      list.slice(0, cap).forEach(function (e) {
        // upcoming vs history by DATE (the modal's rule), not by source:
        // s_ tables also carry future events
        var tip = e.d + (ds >= TODAY ? ' [Upcoming]'
                                     : ' [Historical: ' + ds + ']');
        h += '<div class="ev-slot">'
          + '<a class="ev-code" href="#' + esc(e.c) + '" data-code="' + esc(e.c)
          + '" title="' + esc(tip) + '">' + esc(e.c) + '</a>';
        if (!we && n <= 9) {
          h += '<div class="ev-desc" data-code="' + esc(e.c)
            + '" title="' + esc(e.d) + '">' + esc(e.d) + '</div>';
        }
        h += '</div>';
      });
      if (n > cap) h += '<div class="ev-more">+' + (n - cap) + ' more</div>';
      h += '</div>';
    }
    document.getElementById('calGrid').innerHTML = h;
  }

  function movePeriod(delta) {
    periodStart = addD(periodStart, delta);
    renderCalendar();
  }

  // ---- all events table (built once, on first switch) --------------------
  var allBuilt = false;
  function buildAll() {
    allBuilt = true;
    var lst = [];
    Object.keys(EV).forEach(function (code) {
      (EV[code] || []).forEach(function (e) {
        if (e && e.date) lst.push({ date: e.date, code: code, desc: e.desc || '' });
      });
    });
    lst.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.code < b.code ? -1 : (a.code > b.code ? 1 : 0);
    });
    var h = "<table class='ev-tbl'><thead><tr><th>Date</th><th>Code</th>"
      + '<th>Market</th><th>Event</th></tr></thead><tbody>';
    lst.forEach(function (r) {
      h += '<tr><td class="mono' + (r.date >= TODAY ? ' up' : '') + '">'
        + esc(r.date) + '</td>'
        + '<td><a class="cell-btn" data-code="' + esc(r.code) + '" href="#'
        + esc(r.code) + '">' + esc(r.code) + '</a></td>'
        + '<td class="mono">' + esc((MARKS[r.code] || '').toUpperCase()) + '</td>'
        + '<td>' + esc(r.desc) + '</td></tr>';
    });
    h += '</tbody></table>';
    document.getElementById('allTbl').innerHTML = h;
  }

  // ---- code modal --------------------------------------------------------
  function newsHref(code) {
    var t = new Date(), y = new Date(t.getTime());
    y.setFullYear(y.getFullYear() - 1);
    return 'http://127.0.0.1:5001/?index=' + encodeURIComponent(code)
      + '&date=' + fmt(y) + '_' + fmt(t) + '&sentiment=ALL';
  }
  function rows(list, cls) {
    var h = '';
    list.forEach(function (e) {
      h += '<div class="ev-row"><span class="ev-badge ' + cls + '">'
        + esc(e.date) + '</span><span class="ev-txt">' + esc(e.desc)
        + '</span></div>';
    });
    return h;
  }
  function openCode(code) {
    code = String(code || '').toUpperCase();
    var evs = (EV[code] || []).slice();
    var up = [], hist = [], seen = {};
    evs.forEach(function (e) {
      var k = e.date + '\u0000' + e.desc;
      if (seen[k]) return;
      seen[k] = 1;
      if (e.date >= TODAY) up.push(e); else hist.push(e);
    });
    up.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    hist.sort(function (a, b) { return a.date > b.date ? -1 : 1; });

    document.getElementById('modalTitle').textContent =
      'Events \u2013 ' + code + (MARKS[code] ? ' \u00b7 ' + MARKS[code].toUpperCase() : '');

    var h = '<div class="ev-links"><a href="' + newsHref(code)
      + '" target="_blank" rel="noopener" title="news dashboard (needs the '
      + 'flask server on port 5001)">News (last 12 months)</a>';
    (LINKS[code] || []).forEach(function (l) {
      h += '<a href="' + esc(l[1]) + '" target="_blank" rel="noopener" title="'
        + esc(l[0]) + '">' + esc(l[0]) + '</a>';
    });
    h += '</div>';
    h += '<div class="ev-actions">analytics &rarr; run in xpot.hta: EPS Revision'
      + ' &middot; EPS Trend &middot; EPS Momentum &middot; EPS Consensus'
      + ' &middot; Analyst Impact &middot; Alpha</div>';

    if (!up.length && !hist.length) {
      h += '<p class="meta">No events stored for this code.</p>';
    } else {
      if (up.length) h += '<div class="ev-sec">Upcoming (' + up.length + ')</div>' + rows(up, 'up');
      if (hist.length) h += '<div class="ev-sec">History (' + hist.length + ')</div>' + rows(hist, 'hist');
    }
    document.getElementById('modalBody').innerHTML = h;
    document.getElementById('eventModal').classList.add('open');
  }
  function closeEventModal(e) {
    if (!e || e.target === document.getElementById('eventModal')
        || (e.target.classList && e.target.classList.contains('modal-close'))) {
      document.getElementById('eventModal').classList.remove('open');
    }
  }
  window.closeEventModal = closeEventModal;
  window.openCode = openCode;

  // ---- search ------------------------------------------------------------
  function doSearch() {
    var q = (document.getElementById('evSearch').value || '').trim().toUpperCase();
    if (!q) return;
    if (EV[q]) { openCode(q); return; }
    var m = CODES.filter(function (c) { return c.indexOf(q) === 0; });
    if (m.length === 1) { openCode(m[0]); return; }
    document.getElementById('modalTitle').textContent = 'Search \u2013 ' + q;
    document.getElementById('modalBody').innerHTML =
      '<p class="meta">No stored events for &quot;' + esc(q) + '&quot;'
      + (m.length ? ' &middot; similar: ' + m.slice(0, 10).map(esc).join(', ')
                  : '') + '.</p>';
    document.getElementById('eventModal').classList.add('open');
  }

  // ---- view toggle -------------------------------------------------------
  function applyView(v) {
    document.getElementById('calView').style.display = (v === 'all') ? 'none' : '';
    document.getElementById('allView').style.display = (v === 'all') ? '' : 'none';
    var bCal = document.getElementById('viewCal');
    var bAll = document.getElementById('viewAll');
    if (bCal) bCal.classList.toggle('active', v !== 'all');
    if (bAll) bAll.classList.toggle('active', v === 'all');
    if (v === 'all' && !allBuilt) buildAll();
    try { localStorage.setItem('typelink_event_view', v); } catch (e) {}
  }

  // ---- wiring ------------------------------------------------------------
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList
        && (t.classList.contains('ev-code')
            || t.classList.contains('ev-desc')
            || t.classList.contains('cell-btn'))) {
      e.preventDefault();
      openCode(t.getAttribute('data-code'));
      return;
    }
    if (t.id === 'viewCal') { applyView('cal'); return; }
    if (t.id === 'viewAll') { applyView('all'); return; }
    if (t.id === 'cPrev') { movePeriod(-14); return; }
    if (t.id === 'cNext') { movePeriod(14); return; }
    if (t.id === 'cToday') { periodStart = monday(new Date()); renderCalendar(); return; }
    if (t.id === 'evGo') { doSearch(); return; }
    closeEventModal(e);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var m = document.getElementById('eventModal');
      if (m) m.classList.remove('open');
    }
    if (e.key === 'Enter' && e.target && e.target.id === 'evSearch') doSearch();
  });
  window.addEventListener('hashchange', function () {
    var code = location.hash.slice(1).toUpperCase();
    if (code && EV[code]) openCode(code);
  });

  // init: code datalist, calendar, stored view, deep link #CODE
  var dl = document.getElementById('evCodes');
  if (dl) {
    var dh = '';
    CODES.forEach(function (c) { dh += '<option value="' + esc(c) + '">'; });
    dl.innerHTML = dh;
  }
  renderCalendar();
  var v = 'cal';
  try { v = localStorage.getItem('typelink_event_view') || 'cal'; } catch (e) {}
  applyView(v);
  var hc = location.hash.slice(1).toUpperCase();
  if (hc && EV[hc]) openCode(hc);
})();
</script>
