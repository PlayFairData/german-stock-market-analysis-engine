    <style>

        /*

<body>
<div class="meta">State Report (archive)</div>
<div class="crumb"><a href="index.html">&larr; Archive index</a> &middot; <a href="../stage_report.html">Live report</a></div><h1 id="vTitle">State Report</h1><div class='cmp-controls'><button id='vPrev' type='button'>&lsaquo; Prev</button><select id='vSel'></select><button id='vNext' type='button'>Next &rsaquo;</button></div><div class='view-toggle'>View: <button id='viewStd' type='button' title='show DAX, MDAX, SDAX only'>Standard</button> <button id='viewAll' type='button' title='also show experimental PDAX, CDAX'>All incl. experimental</button></div><div class='crumb'>Click a number for the stocks of that state, then <b>Detail</b> for the full overview of a stock.</div><div id='vMatrix'></div><div id='vSummary'></div><div id="stockModal" class="modal-backdrop" onclick="closeStockModal(event)"><div class="modal-card"><div class="modal-header"><h3 id="modalTitle">Stocks</h3><button type="button" class="modal-close" onclick="closeStockModal()">&times;</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script src="history.js"></script>


<script>
(function () {
  var KEY = 'typelink_report_view';
  function apply(mode) {
    var stdOnly = (mode !== 'all');
    document.body.classList.toggle('std-only', stdOnly);
    var bStd = document.getElementById('viewStd');
    var bAll = document.getElementById('viewAll');
    if (bStd) bStd.classList.toggle('active', stdOnly);
    if (bAll) bAll.classList.toggle('active', !stdOnly);
    try { localStorage.setItem(KEY, stdOnly ? 'std' : 'all'); } catch (e) {}
  }
  function init() {
    var mode = 'std';
    try { mode = localStorage.getItem(KEY) || 'std'; } catch (e) {}
    var bStd = document.getElementById('viewStd');
    var bAll = document.getElementById('viewAll');
    if (!bStd || !bAll) return;   // page without the toggle
    bStd.addEventListener('click', function () { apply('std'); });
    bAll.addEventListener('click', function () { apply('all'); });
    apply(mode);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var STOCK_CTX = {idx: '', list: []};
function renderStocks(idx, st, list) {
  STOCK_CTX.idx = idx;
  STOCK_CTX.list = list;
  var n = list.length;
  document.getElementById('modalTitle').textContent =
    idx + ' \u2014 ' + st + ' (' + n + ' stock' + (n !== 1 ? 's' : '') + ')';
  var b = document.getElementById('modalBody');
  if (!n) {
    b.innerHTML = '<p class="meta">No stock records found.</p>';
  } else {
    var h = '';
    list.forEach(function (s, i) {
      var t = s.trend || '';
      var bCls = t.indexOf('BULL') >= 0 ? ' bull' : (t.indexOf('BEAR') >= 0 ? ' bear' : '');
      h += '<div class="stock-item"><div class="stock-head">';
      h += '<span class="stock-code">' + esc(s.code) + '</span>';
      if (s.score != null) h += '<span class="stock-badge">Score ' + esc(s.score) + '</span>';
      if (s.confidence != null) h += '<span class="stock-badge">Conf ' + esc(s.confidence) + '%</span>';
      if (s.energy) h += '<span class="stock-badge">' + esc(s.energy) + '</span>';
      if (t) h += '<span class="stock-badge' + bCls + '">' + esc(t) + '</span>';
      h += '<button type="button" class="detail-btn" data-i="' + i + '">Detail</button></div>';
      if (s.summary) h += '<div class="stock-sum">' + esc(s.summary) + '</div>';
      h += '<pre class="stock-detail" id="sd' + i + '"></pre></div>';
    });
    b.innerHTML = h;
  }
  document.getElementById('stockModal').classList.add('open');
}
document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t.classList || !t.classList.contains('detail-btn')) return;
  var i = parseInt(t.getAttribute('data-i'), 10);
  var pre = document.getElementById('sd' + i);
  var rec = STOCK_CTX.list[i];
  if (!pre || !rec) return;
  if (pre.classList.contains('open')) {
    pre.classList.remove('open');
    t.textContent = 'Detail';
    return;
  }
  t.textContent = 'Hide detail';
  function show(text) {
    pre.textContent = text || 'no detail text stored for this stock/day';
    pre.classList.add('open');
  }
  if (rec.detail != null) { show(rec.detail); return; }
  if (window.loadStockDetail) {
    pre.textContent = 'loading ...';
    pre.classList.add('open');
    window.loadStockDetail(STOCK_CTX.idx, rec.code, show);
  } else {
    show('');
  }
});
function closeStockModal(e) {
  if (!e || e.target === document.getElementById('stockModal') || e.target.classList.contains('modal-close')) {
    document.getElementById('stockModal').classList.remove('open');
  }
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var m = document.getElementById('stockModal');
    if (m) m.classList.remove('open');
  }
});
window.addEventListener('hashchange', function () {
  var el = document.getElementById(location.hash.slice(1));
  if (el && el.tagName === 'DETAILS') el.open = true;
});
if (location.hash) {
  var hel = document.getElementById(location.hash.slice(1));
  if (hel && hel.tagName === 'DETAILS') hel.open = true;
}
</script>

<script>
(function () {
  var H = window.STAGE_HISTORY || {};
  var dates = Object.keys(H).sort();
  var EXP = ['PDAX', 'CDAX'];
  function isExp(i) { return EXP.indexOf(i) >= 0; }
  var q = new URLSearchParams(location.search).get('date');
  var date = (q && H[q]) ? q : (dates.length ? dates[dates.length - 1] : '');
  var month = date.slice(0, 7);
  var DAY = null;

  function loadScript(src, ok, fail) {
    var s = document.createElement('script');
    s.onload = ok;
    s.onerror = fail;
    s.src = src;
    document.head.appendChild(s);
  }
  function go(d) { location.href = 'archive.html?date=' + d; }
  function msg(t) {
    document.getElementById('vMatrix').innerHTML = '<p class="meta">' + esc(t) + '</p>';
  }

  // full stock text lives in data/YYYY-MM.detail.js, loaded on the first Detail click
  window.loadStockDetail = function (idx, code, cb) {
    function pick() {
      var m = (window.STAGE_DETAIL || {})[month];
      var t = m && m[date] && m[date][idx] && m[date][idx][code];
      cb(t || '');
    }
    if ((window.STAGE_DETAIL || {})[month]) { pick(); return; }
    loadScript('data/' + month + '.detail.js', pick, function () { cb(''); });
  };

  function initNav() {
    var sel = document.getElementById('vSel');
    for (var i = dates.length - 1; i >= 0; i--) {
      var o = document.createElement('option');
      o.value = dates[i];
      o.textContent = dates[i];
      sel.appendChild(o);
    }
    sel.value = date;
    sel.addEventListener('change', function () { go(sel.value); });
    var pos = dates.indexOf(date);
    var pv = document.getElementById('vPrev');
    var nx = document.getElementById('vNext');
    pv.disabled = pos <= 0;
    nx.disabled = pos < 0 || pos >= dates.length - 1;
    pv.addEventListener('click', function () { go(dates[pos - 1]); });
    nx.addEventListener('click', function () { go(dates[pos + 1]); });
  }

  function render() {
    var d = DAY;
    var h = '';
    if (q && q !== date) {
      h += '<p class="meta">no archived data for ' + esc(q) + ' &mdash; showing the latest day</p>';
    }
    h += "<table class='matrix'><thead><tr><th>State</th>";
    d.indexes.forEach(function (i) {
      var hasSum = d.overview_summary && d.overview_summary[i];
      h += '<th' + (isExp(i) ? ' class="col-exp"' : '') + '>' +
        (hasSum ? '<a href="#ovsum_' + i.toLowerCase() + '">' + esc(i) + '</a>' : esc(i)) +
        (isExp(i) ? ' <span class="exp-tag">experimental</span>' : '') + '</th>';
    });
    h += '<th>Total</th><th>Share</th></tr></thead><tbody>';
    d.stages.forEach(function (st) {
      var row = d.matrix[st] || {};
      h += '<tr><td>' + esc(st) + '</td>';
      d.indexes.forEach(function (i) {
        var cls = isExp(i) ? ' class="col-exp"' : '';
        if (!d.stocks[i]) { h += '<td' + cls + '>&ndash;</td>'; return; }
        var n = row[i] || 0;
        if (n > 0) {
          h += '<td' + cls + '><button type="button" class="cell-btn" data-idx="' + esc(i) +
            '" data-st="' + esc(st) + '" title="' + n + ' ' + esc(i) + ' stock(s) in ' +
            esc(st) + '">' + n + '</button></td>';
        } else {
          h += '<td' + cls + '>0</td>';
        }
      });
      h += '<td class="tot">' + (row.total || 0) + '</td><td>' + (row.share || 0).toFixed(1) + '%</td></tr>';
    });
    h += '</tbody></table>';
    document.getElementById('vMatrix').innerHTML = h;

    var sh = '';
    d.indexes.forEach(function (i) {
      var t = (d.overview_summary || {})[i];
      if (!t) return;
      sh += '<details id="ovsum_' + i.toLowerCase() + '" class="ovsum' + (isExp(i) ? ' ovsum-exp' : '') +
        '"><summary>' + esc(i) + '</summary><pre class="detail">' + esc(t) + '</pre></details>';
    });
    document.getElementById('vSummary').innerHTML = sh ? '<h2>Overview Summary</h2>' + sh : '';
  }

  document.getElementById('vMatrix').addEventListener('click', function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains('cell-btn')) return;
    var idx = t.getAttribute('data-idx');
    var st = t.getAttribute('data-st');
    var list = ((DAY.stocks || {})[idx] || []).filter(function (r) { return r.stage === st; });
    renderStocks(idx, st, list);
  });

  function init() {
    if (!date) { msg('no archived days yet'); return; }
    initNav();
    document.getElementById('vTitle').textContent =
      'German Stock Market State Report \u2014 ' + date;
    loadScript('data/' + month + '.js', function () {
      var M = (window.STAGE_MONTHS || {})[month];
      DAY = M && M[date];
      if (!DAY) { msg('no data for ' + date + ' in data/' + month + '.js'); return; }
      render();
    }, function () { msg('cannot load data/' + month + '.js'); });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
