<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>State Report</title>
<!-- Static viewer -- written ONCE and never regenerated (the news-report
     pattern, typelink_news.py).  All data comes from the .js data holders
     written by `typelink_ov.py reportall` (file://-safe <script src>, never
     fetch -- browsers block fetch() of local json on file://):
       stageReport/stage_report_data.js  window.STAGE_DATA     (full latest payload)
       stageReport/history.js            window.STAGE_HISTORY  (light per-day) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StageReport">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; margin: 0;
           padding: 24px; background: #fff; color: #202124; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 26px 0 8px; }
    .meta { color: #70757a; font-size: .85rem; margin-bottom: 18px; }
    .crumb { margin-bottom: 14px; font-size: .92rem; }
    a { color: #1a73e8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    table.matrix { border-collapse: collapse; font-size: .98rem; }
    table.matrix th, table.matrix td { padding: 11px 26px 11px 0;
        text-align: left; border-bottom: 1px solid #ececec; white-space: nowrap; }
    table.matrix th { font-weight: 600; border-bottom: 1px solid #dadce0; }
    table.matrix td.tot { font-weight: 700; }
    table.matrix tr:hover { background: #f8f9fa; }
    pre.detail { background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 6px;
        padding: 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.45;
        font-family: Consolas, 'Courier New', monospace; }
    .view-toggle { margin: 0 0 14px; font-size: .9rem; }
    .view-toggle button { padding: 5px 16px; border: 1px solid #dadce0;
        background: #fff; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    .view-toggle button:hover { background: #f1f3f4; }
    .view-toggle button.active { background: #e8f0fe; border-color: #1a73e8;
        color: #1a73e8; font-weight: 600; }
    table.matrix th.col-exp, table.matrix td.col-exp { background: #fafcff; }
    body.std-only table.matrix th.col-exp,
    body.std-only table.matrix td.col-exp { display: none; }
    .exp-tag { font-size: .7em; color: #9aa0a6; font-weight: 400; }
    details.ovsum { margin: 4px 0 12px; }
    details.ovsum > summary { cursor: pointer; font-weight: 600; padding: 6px 0;
        font-size: .98rem; }
    details.ovsum > summary:hover { color: #1a73e8; }
    details.ovsum[open] > summary { margin-bottom: 6px; }
    body.std-only details.ovsum-exp { display: none; }

    /* Stock detail modal dialog & cell buttons */
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.45); z-index: 1000; align-items: center;
        justify-content: center; padding: 14px; }
    .modal-backdrop.open { display: flex; }
    .modal-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.22);
        width: 100%; max-width: 620px; max-height: 85vh; display: flex; flex-direction: column;
        overflow: hidden; animation: modalIn 0.12s ease-out; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; border-bottom: 1px solid #dadce0; background: #f8f9fa; }
    .modal-header h3 { margin: 0; font-size: 1.02rem; color: #202124; }
    .modal-close { background: none; border: none; font-size: 1.5rem; line-height: 1;
        cursor: pointer; color: #5f6368; padding: 0 4px; }
    .modal-close:hover { color: #202124; }
    .modal-body { padding: 12px 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .stock-item { padding: 8px 0; border-bottom: 1px solid #f1f3f4; }
    .stock-item:last-child { border-bottom: none; }
    .stock-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .stock-code { font-weight: 700; color: #1a73e8; font-size: 0.95rem; }
    .stock-badge { display: inline-block; padding: 1px 7px; border-radius: 4px;
        font-size: 0.74rem; background: #f1f3f4; color: #5f6368; }
    .stock-badge.bull { background: #e6f4ea; color: #0b8a3e; }
    .stock-badge.bear { background: #fce8e6; color: #c5221f; }
    .stock-badge.refined { background: #e8f0fe; color: #1a73e8; }
    .stock-sum { font-size: 0.84rem; color: #3c4043; line-height: 1.4; }
    .stock-links { font-size: 0.76rem; margin: 2px 0 3px; }
    .stock-links a { color: #5f6368; margin-right: 10px; }
    .stock-links a:hover { color: #1a73e8; }
    .chart-links { font-weight: 400; font-size: 0.72rem; margin-top: 2px;
        white-space: nowrap; }
    .chart-links a { color: #5f6368; margin-right: 8px; }
    .chart-links a:hover { color: #1a73e8; }
    .detail-btn { background: none; border: 1px solid #dadce0; border-radius: 4px;
        color: #1a73e8; cursor: pointer; font-size: 0.74rem; padding: 0 8px;
        margin-left: auto; }
    .detail-btn:hover { background: #e8f0fe; }
    pre.stock-detail { display: none; margin: 6px 0 2px; padding: 10px;
        background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 6px;
        font-size: 11.5px; line-height: 1.4; white-space: pre-wrap;
        word-break: break-word; font-family: Consolas, 'Courier New', monospace; }
    pre.stock-detail.open { display: block; }

    /* sticky stock-code chips on top of the modal list (old overview_scan nav) */
    .stock-chips { position: sticky; top: -12px; margin: -12px -14px 8px;
        padding: 8px 14px 4px; background: #fff; border-bottom: 1px solid #e8eaed;
        z-index: 2; }
    .stock-chips a { display: inline-block; margin: 0 10px 5px 0; font-size: .88rem;
        color: #1a73e8; text-decoration: none; }
    .stock-chips a:hover { text-decoration: underline; }
    .stock-flash { animation: chipFlash 1.4s ease-out; }
    @keyframes chipFlash { from { background: #fff3c4; } to { background: transparent; } }

    /* day selector (history.js light view) */
    .day-bar { margin: 0 0 10px; font-size: .9rem; }
    .day-bar select { font-size: .9rem; padding: 4px 8px; }

    /* stock search (delist.js -- tl_delistjson.py) */
    .search-bar { margin: 0 0 12px; font-size: .9rem; }
    .search-bar input { font-size: .95rem; padding: 4px 8px; border: 1px solid #dadce0;
        border-radius: 6px; width: 210px; }
    .search-bar button { padding: 4px 10px; border: 1px solid #dadce0;
        background: #fff; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    .search-bar button:hover { background: #f1f3f4; }
</style>
</head>
<body class="std-only">
<h1 id="title">German Stock Market State Report</h1>
<div class="crumb"><b>&#128202; State</b> &middot;
    <a href="news/index.html">&#128240; News</a> &middot;
    <a href="event/index.html">&#128197; Events</a> &middot;
    <a href="stageReport/index.html">&#128194; Archive</a> &middot;
    <a href="index.html">&#128214; Guide</a></div>
<div class="meta" id="meta">loading data holders ...</div>
<div class="day-bar">Day: <select id="daySel"></select>
    <span class="exp-tag">(from history.js; detail text only for the latest day)</span></div>
<div class="view-toggle">View: <button id="viewStd" type="button" title="show DAX, MDAX, SDAX only">Standard</button>
    <button id="viewAll" type="button" title="also show experimental PDAX, CDAX">All incl. experimental</button></div>
<div class="search-bar">Search: <input id="stSearch" list="stCodes" placeholder="code / WKN / ISIN / name" autocomplete="off"><datalist id="stCodes"></datalist> <button id="stGo" type="button">&#128269;</button></div>
<div class="crumb">State distribution per index &mdash; click a number for stock details, an index name for all its stocks.</div>
<table class="matrix" id="matrix">
<thead id="matrixHead"></thead>
<tbody id="matrixBody"></tbody>
</table>
<div id="ovsumWrap"></div>

<div id="stockModal" class="modal-backdrop" onclick="closeStockModal(event)"><div class="modal-card">
<div class="modal-header">
<h3 id="modalTitle">Stocks</h3>
<button type="button" class="modal-close" onclick="closeStockModal()">&times;</button>
</div>
<div class="modal-body" id="modalBody"></div>
</div></div>

<script src="stageReport/stage_report_data.js"></script>
<script src="stageReport/history.js"></script>
<script src="delist.js"></script>
<script>
(function () {
  var KEY = 'typelink_report_view';
  function apply(mode) {
    var stdOnly = (mode !== 'all');
    document.body.classList.toggle('std-only', stdOnly);
    var bStd = document.getElementById('viewStd');
    var bAll = document.getElementById('viewAll');
    if (bStd) bStd.classList.toggle('active', stdOnly);
    if (bAll) bAll.classList.toggle('active', !stdOnly);
    try { localStorage.setItem(KEY, stdOnly ? 'std' : 'all'); } catch (e) {}
  }
  function init() {
    var mode = 'std';
    try { mode = localStorage.getItem(KEY) || 'std'; } catch (e) {}
    apply(mode);
    var bStd = document.getElementById('viewStd');
    var bAll = document.getElementById('viewAll');
    if (bStd) bStd.addEventListener('click', function () { apply('std'); });
    if (bAll) bAll.addEventListener('click', function () { apply('all'); });
  }
  init();
})();
</script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var STOCK_CTX = {idx: '', st: '', list: []};
function renderStocks(idx, st, list) {
  STOCK_CTX.idx = idx;
  STOCK_CTX.st = st;
  list = list.slice().sort(function (a, b) {   // codes ascending -- easy finding
    return a.code < b.code ? -1 : a.code > b.code ? 1 : 0;
  });
  STOCK_CTX.list = list;
  var n = list.length;
  document.getElementById('modalTitle').textContent =
    (st ? idx + ' \u2014 ' + st : idx + ' \u2014 all states') +
    ' (' + n + ' stock' + (n !== 1 ? 's' : '') + ')';
  var b = document.getElementById('modalBody');
  if (!n) {
    b.innerHTML = '<p class="meta">No stock records found.</p>';
  } else {
    var h = '<div class="stock-chips">' + list.map(function (s) {
      var sum = s.summary || '';
      return '<a href="#" data-code="' + esc(s.code) + '"' +
        (sum ? ' title="' + esc(sum) + '"' : '') + '>' + esc(s.code) + '</a>';
    }).join('') + '</div>';
    list.forEach(function (s, i) {
      var t = s.trend || '';
      var bCls = t.indexOf('BULL') >= 0 ? ' bull' : (t.indexOf('BEAR') >= 0 ? ' bear' : '');
      h += '<div class="stock-item" data-code="' + esc(s.code) + '"><div class="stock-head">';
      h += '<span class="stock-code">' + esc(s.code) + '</span>';
      if (s.stage && s.stage !== st) {
        h += '<span class="stock-badge refined" title="refined state">' + esc(s.stage) + '</span>';
      }
      if (s.score != null) h += '<span class="stock-badge">Score ' + esc(s.score) + '</span>';
      if (s.confidence != null) h += '<span class="stock-badge">Conf ' + esc(s.confidence) + '%</span>';
      if (s.energy) h += '<span class="stock-badge">' + esc(s.energy) + '</span>';
      if (t) h += '<span class="stock-badge' + bCls + '">' + esc(t) + '</span>';
      h += '<button type="button" class="detail-btn" data-i="' + i + '">Detail</button></div>';
      if (s.charts && s.charts.length) {
        h += '<div class="stock-links">';
        s.charts.forEach(function (c) {
          h += '<a href="' + esc(c[1]) + '" target="_blank" rel="noopener" title="open ' +
               esc(c[0]) + ' chart">' + esc(c[0]) + '</a>';
        });
        h += '</div>';
      }
      if (s.summary) h += '<div class="stock-sum">' + esc(s.summary) + '</div>';
      h += '<pre class="stock-detail" id="sd' + i + '"></pre></div>';
    });
    b.innerHTML = h;
  }
  document.getElementById('stockModal').classList.add('open');
}
document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t.classList || !t.classList.contains('detail-btn')) return;
  var i = parseInt(t.getAttribute('data-i'), 10);
  var pre = document.getElementById('sd' + i);
  var rec = STOCK_CTX.list[i];
  if (!pre || !rec) return;
  if (pre.classList.contains('open')) {
    pre.classList.remove('open');
    t.textContent = 'Detail';
    return;
  }
  t.textContent = 'Hide detail';
  pre.textContent = (rec.detail != null)
    ? rec.detail : 'no detail text stored for this stock/day';
  pre.classList.add('open');
});
// stock-code chip: scroll the list to that stock and flash it
document.getElementById('modalBody').addEventListener('click', function (e) {
  var t = e.target;
  if (!t.getAttribute || t.tagName !== 'A' || !t.getAttribute('data-code')) return;
  e.preventDefault();
  var code = t.getAttribute('data-code');
  var items = this.getElementsByClassName('stock-item');
  var item = null;
  for (var k = 0; k < items.length; k++) {
    if (items[k].getAttribute('data-code') === code) { item = items[k]; break; }
  }
  if (!item) return;
  var br = this.getBoundingClientRect();
  var ir = item.getBoundingClientRect();
  if (ir.top < br.top + 44) {           // above visible top / hidden under the sticky chips
    this.scrollTop -= br.top + 44 - ir.top;
  } else if (ir.bottom > br.bottom) {   // below visible bottom
    this.scrollTop += ir.bottom - br.bottom + 8;
  }
  item.classList.remove('stock-flash');
  void item.offsetWidth;                // restart the highlight animation
  item.classList.add('stock-flash');
});
function closeStockModal(e) {
  if (!e || e.target === document.getElementById('stockModal') || e.target.classList.contains('modal-close')) {
    document.getElementById('stockModal').classList.remove('open');
  }
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var m = document.getElementById('stockModal');
    if (m) m.classList.remove('open');
  }
});
</script>
<script>
(function () {
  var D = window.STAGE_DATA || null;
  var H = window.STAGE_HISTORY || {};
  var EXP = {PDAX: 1, CDAX: 1};
  var GROUP = {};

  function isExp(i) { return !!EXP[i]; }
  function stageKey(s) {
    // matrix cells key on the FIRST state token ('DOWNTREND' of
    // 'DOWNTREND + REBOUND_SIGN') -- same split STAGE_RE does server-side
    return String(s == null ? '' : s).split(/[^A-Z_]+/)[0] || 'UNKNOWN';
  }
  // chart pages (typelink_macd.py / typelink_pos.py next to this report).
  // Production linked only files that exist on disk; the static viewer always
  // emits the standard hrefs (a missing page 404s harmlessly).
  function chartLinks(code) {
    var n = String(code).toLowerCase();
    return [['Signal', 'macd/macd_s_' + n + '.html'],
            ['POS', 'pos/pos_s_' + n + '.html']];
  }
  function indexChartLinks(idx) {
    var n = String(idx).toLowerCase();
    return [['Signal', 'macd/macd_pm_' + n + '.html'],
            ['POS', 'pos/pos_pm_' + n + '.html']];
  }
  function chartHtml(links) {
    if (!links.length) return '';
    return '<div class="chart-links">' + links.map(function (c) {
      return '<a href="' + esc(c[1]) + '" target="_blank" rel="noopener" title="open ' +
             esc(c[0]) + ' chart">' + esc(c[0]) + '</a>';
    }).join(' ') + '</div>';
  }
  function groupStocks(stocks) {
    var g = {};
    Object.keys(stocks || {}).forEach(function (idx) {
      var per = {};
      var v = stocks[idx];
      if (Array.isArray(v)) {
        v.forEach(function (rec) {
          rec.charts = chartLinks(rec.code);
          (per[stageKey(rec.stage)] = per[stageKey(rec.stage)] || []).push(rec);
        });
      } else {
        Object.keys(v || {}).forEach(function (code) {
          (per[stageKey(v[code])] = per[stageKey(v[code])] || [])
            .push({code: code, stage: v[code]});
        });
      }
      g[idx] = per;
    });
    return g;
  }

  window.showStocks = function (idx, st) {
    renderStocks(idx, st, (GROUP[idx] || {})[st] || []);
  };

  // index header -> one modal with EVERY stock of the index, stock codes
  // ascending (same easy-finding layout as the old overview_scan nav chips)
  window.showIndexStocks = function (idx) {
    var per = GROUP[idx] || {};
    var list = [];
    Object.keys(per).forEach(function (st) { list = list.concat(per[st] || []); });
    list.sort(function (a, b) {
      return a.code < b.code ? -1 : a.code > b.code ? 1 : 0;
    });
    renderStocks(idx, '', list);
  };

  function renderView(v) {
    GROUP = groupStocks(v.stocks);
    var cols = v.indexes || [];
    var stages = v.stages || [];
    document.getElementById('title').innerHTML =
      'German Stock Market State Report' + (v.date ? ' &mdash; ' + esc(v.date) : '');
    var meta = 'State Report ' + esc(v.date || '');
    if (v.generated) meta += ' &middot; generated ' + esc(v.generated);
    if (v.source_log) meta += ' &middot; source ' + esc(v.source_log);
    document.getElementById('meta').innerHTML = meta;

    var head = '<tr><th>State</th>';
    cols.forEach(function (i) {
      head += '<th' + (isExp(i) ? ' class="col-exp"' : '') + '>' +
        '<a href="#" onclick="showIndexStocks(\'' + i + '\');return false;" title="show all ' +
        esc(i) + ' stocks">' + esc(i) + '</a>' +
        (isExp(i) ? ' <span class="exp-tag">experimental</span>' : '') +
        chartHtml(indexChartLinks(i)) + '</th>';
    });
    head += '<th>Total</th><th>Share</th></tr>';
    document.getElementById('matrixHead').innerHTML = head;

    var body = '';
    stages.forEach(function (st) {
      var row = v.matrix[st] || {};
      body += '<tr><td>' + esc(st) + '</td>';
      cols.forEach(function (idx) {
        var exp = isExp(idx) ? ' class="col-exp"' : '';
        if (v.stocks && !(idx in v.stocks)) {
          body += '<td' + exp + '>&ndash;</td>';   // section not in the log
          return;
        }
        var n = row[idx] || 0;
        if (n > 0) {
          body += '<td' + exp + '><a href="#" onclick="showStocks(\'' + idx +
            '\', \'' + st + '\');return false;" title="' + n + ' ' + idx +
            ' stock(s) in ' + esc(st) + '">' + n + '</a></td>';
        } else {
          body += '<td' + exp + '>0</td>';
        }
      });
      var share = row.share;
      if (share == null) {
        share = v.grand_total ? Math.round(row.total / v.grand_total * 1000) / 10 : 0;
      }
      body += '<td class="tot">' + (row.total || 0) + '</td><td>' +
        Number(share).toFixed(1) + '%</td></tr>';
    });
    document.getElementById('matrixBody').innerHTML = body;

    var wrap = document.getElementById('ovsumWrap');
    var sum = v.overview_summary || {};
    var html = '';
    cols.forEach(function (idx) {
      var blk = sum[idx];
      if (!blk) return;
      html += '<details id="ovsum_' + idx.toLowerCase() + '" class="ovsum' +
        (isExp(idx) ? ' ovsum-exp' : '') + '"><summary>' + esc(idx) +
        '</summary><pre class="detail">' + esc(blk) + '</pre></details>';
    });
    wrap.innerHTML = html ? '<h2>Overview Summary</h2>' + html : '';
  }

  var sel = document.getElementById('daySel');
  function addOpt(value, label) {
    var o = document.createElement('option');
    o.value = value;
    o.textContent = label;
    sel.appendChild(o);
  }
  addOpt('', D ? D.date + ' (latest)' : 'latest');
  Object.keys(H).sort().reverse().forEach(function (d) {
    if (D && d === D.date) return;
    addOpt(d, d);
  });
  sel.addEventListener('change', function () {
    var d = sel.value;
    if (!d) {
      if (D) renderView(D);
      return;
    }
    var h = H[d];
    if (h) {
      renderView({date: d, indexes: h.indexes, stages: h.stages, matrix: h.matrix,
                  index_totals: h.index_totals, grand_total: h.grand_total,
                  stocks: h.stocks});
    }
  });

  if (D) {
    renderView(D);
  } else {
    var dates = Object.keys(H).sort().reverse();
    if (dates.length) {
      sel.value = dates[0];
      sel.dispatchEvent(new Event('change'));
    } else {
      document.getElementById('meta').textContent =
        'no data holders found -- run: python typelink_ov.py reportall';
    }
  }

  // deep link: stage_report.html?code=AG1 (the event page's "Overview")
  // opens the stock modal filtered to that one code -- the Detail button
  // then shows the full text straight from STAGE_DATA
  var qCode = '';
  try { qCode = (new URLSearchParams(location.search).get('code') || '').trim(); } catch (e) {}
  if (qCode && D) {
    var want = qCode.toUpperCase();
    var hit = null, hitIdx = '', hitSt = '';
    Object.keys(GROUP).some(function (ix) {
      return Object.keys(GROUP[ix] || {}).some(function (st) {
        return (GROUP[ix][st] || []).some(function (rec) {
          if (String(rec.code).toUpperCase() === want) {
            hit = rec; hitIdx = ix; hitSt = st;
            return true;
          }
          return false;
        });
      });
    });
    if (hit) {
      renderStocks(hitIdx, hitSt, [hit]);
      document.getElementById('modalTitle').textContent =
        hit.code + ' \u2014 ' + hitIdx + ' \u00b7 ' + hitSt + ' (1 stock)';
    } else {
      STOCK_CTX.list = [];
      document.getElementById('modalTitle').textContent = want;
      document.getElementById('modalBody').innerHTML =
        '<p class="meta">code ' + esc(want) + ' not found in the ' +
        esc(D.date || 'latest') + ' state report.</p>';
      document.getElementById('stockModal').classList.add('open');
    }
  }

  // ---- stock search (pilot: code / WKN / ISIN / fullname / ovname / name) -
  // window.DELIST.stocks comes from delist.js (tl_delistjson.py).  Results
  // open the existing stock modal -- the same "jump" as stage_report.html?code=X
  function searchDelist(q) {
    var list = (window.DELIST && window.DELIST.stocks) || null;
    if (!list) return null;
    var qu = q.toUpperCase(), ql = q.toLowerCase();
    var hits = [];
    list.forEach(function (r) {
      var code = (r.Code || '').toUpperCase();
      var rank = -1;
      if (code && code.indexOf(qu) === 0) rank = 0;
      else if (r.WKN && String(r.WKN).toUpperCase().indexOf(qu) === 0) rank = 1;
      else if (r.ISIN && String(r.ISIN).toUpperCase().indexOf(qu) === 0) rank = 1;
      else if (r.FullName && String(r.FullName).toLowerCase().indexOf(ql) >= 0) rank = 2;
      else if (r.ovname && String(r.ovname).toLowerCase().indexOf(ql) >= 0) rank = 2;
      else if (r.Name && String(r.Name).toLowerCase().indexOf(ql) >= 0) rank = 2;
      if (rank >= 0) hits.push({ r: r, code: code, rank: rank });
    });
    hits.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      return a.code < b.code ? -1 : (a.code > b.code ? 1 : 0);
    });
    return hits;
  }
  function findInGroup(want) {           // code -> {rec, idx, st} or null
    var hit = null, fIdx = '', fSt = '';
    Object.keys(GROUP).some(function (ix) {
      return Object.keys(GROUP[ix] || {}).some(function (st) {
        return (GROUP[ix][st] || []).some(function (rec) {
          if (String(rec.code).toUpperCase() === want) {
            hit = rec; fIdx = ix; fSt = st;
            return true;
          }
          return false;
        });
      });
    });
    return hit ? {rec: hit, idx: fIdx, st: fSt} : null;
  }
  function searchOpen(title, html) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('stockModal').classList.add('open');
  }
  function searchHit(f) {
    renderStocks(f.idx, f.st, [f.rec]);
    document.getElementById('modalTitle').textContent =
      f.rec.code + ' \u2014 ' + f.idx + ' \u00b7 ' + f.st + ' (1 stock)';
  }
  function doSearch() {
    var q = (document.getElementById('stSearch').value || '').trim();
    if (!q) return;
    var qu = q.toUpperCase();
    var direct = findInGroup(qu);        // exact code present -> open at once
    if (direct) { searchHit(direct); return; }
    var hits = searchDelist(q);
    var t = 'Search \u2013 ' + q;
    if (!hits) {
      searchOpen(t, '<p class="meta">Search data not found &mdash; run: ' +
        'python C:\\nb\\bin\\WSHOME\\tl_delistjson.py</p>');
      return;
    }
    if (!hits.length) {
      searchOpen(t, '<p class="meta">No match for &quot;' + esc(q) +
        '&quot; in code / WKN / ISIN / fullname / ovname / name.</p>');
      return;
    }
    var found = [], missing = [];
    hits.forEach(function (x) {
      var f = findInGroup(x.code);
      if (f) found.push(f); else missing.push(x.code);
    });
    if (!found.length) {
      searchOpen(t, '<p class="meta">' + hits.length + ' match' +
        (hits.length === 1 ? '' : 'es') + ' in delist, none in the ' +
        esc(D ? D.date + ' state report' : 'state report') + ': ' +
        esc(missing.slice(0, 12).join(', ')) +
        (missing.length > 12 ? ' \u2026' : '') + '.</p>');
      return;
    }
    if (found.length === 1 && !missing.length) { searchHit(found[0]); return; }
    renderStocks(found[0].idx, found[0].st,
                 found.map(function (f) { return f.rec; }));
    document.getElementById('modalTitle').textContent =
      t + ' (' + found.length + ' stock' + (found.length === 1 ? '' : 's') + ')';
    if (missing.length) {                // partial: note what is not in the day
      var b = document.getElementById('modalBody');
      b.innerHTML = '<p class="meta">not in this state report: ' +
        esc(missing.join(', ')) + '</p>' + b.innerHTML;
    }
  }
  (function () {
    var dl = document.getElementById('stCodes');
    if (dl) {
      var dh = '';
      var DS = (window.DELIST && window.DELIST.stocks) || null;
      if (DS) {                       // code values + name labels from delist
        DS.forEach(function (r) {
          var c = (r.Code || '').toUpperCase();
          if (!c) return;
          var nm = r.FullName || r.ovname || r.Name || '';
          dh += '<option value="' + esc(c) + '"' +
            (nm ? ' label="' + esc(nm) + '"' : '') + '>';
        });
      }
      dl.innerHTML = dh;
    }
    document.getElementById('stGo').addEventListener('click', doSearch);
    document.getElementById('stSearch').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
    });
  })();
})();
</script>
